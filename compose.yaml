name: diyet

services:
  web:
    image: ${APP_IMAGE:-diyet-web:local}
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:-https://gunayturan.com.tr}
    environment:
      SITE_URL: ${SITE_URL:-https://gunayturan.com.tr}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - next_cache:/app/.next/cache
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  next_cache:
