name: diyet

services:
  web:
    image: ${APP_IMAGE:-diyet-web:local}
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:-https://gunayturan.com.tr}
    environment:
      SITE_URL: ${SITE_URL:-https://gunayturan.com.tr}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      CMS_ALLOWED_ORIGINS: https://gunayturan.com.tr,http://localhost:${APP_PORT:-3000},http://127.0.0.1:${APP_PORT:-3000}
    env_file: .env.cms.production
    depends_on:
      cms-init:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - next_cache:/app/.next/cache
      - media:/app/media
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cms-init:
    image: diyet-cms:tooling-production
    build:
      context: .
      target: tooling
    env_file: .env.cms.production
    environment:
      NODE_ENV: production
      SITE_URL: https://gunayturan.com.tr
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  db:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    env_file: .env.cms.production
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  next_cache:
  pg_data:
  media:
