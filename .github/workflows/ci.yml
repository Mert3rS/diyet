name: Proje kontrolleri

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ops
      - run: npm run secrets:audit
      - name: Geçici CMS ortamı
        run: npm run cms:setup -- --email admin@example.invalid
      - name: Compose ve Dockerfile doğrulaması
        run: |
          docker compose config --quiet
          docker compose -f compose.dev.yaml config --quiet
          docker build --check .
      - name: Üretim konteynerini derle ve başlat
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: HTTP, statik varlıklar ve görsel optimizasyonu
        run: npm run test:container -- http://127.0.0.1:3000
      - name: Geliştirme konteyneri
        run: docker compose -f compose.dev.yaml up --build --detach --wait --wait-timeout 120
      - name: Chromium kurulumu
        run: npx playwright install --with-deps chromium --only-shell
      - name: Docker geliştirme sunucusunda tarayıcı testleri
        run: npm run test:e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:3001
      - name: Konteyner logları
        if: failure()
        run: |
          docker compose logs --no-color --tail 100 web
          docker compose -f compose.dev.yaml logs --no-color --tail 100 web
      - name: Konteynerleri kapat
        if: always()
        run: |
          docker compose -f compose.dev.yaml down
          docker compose down
